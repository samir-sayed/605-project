# Milestone 4 — Final System Configuration
# Final system: HOG + cosine similarity + filtered pairs (run05)

seed: 42

data:
  source: sklearn_lfw
  resize: 0.5                   # produces ~62x47 images
  min_faces_baseline: 2
  min_faces_filtered: 5         # final system uses filtered mode

split_policy:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

pair_policy:
  positives_per_identity: 5
  negatives_per_identity: 5
  max_pairs_per_identity: 5

features:
  mode: hog                     # final system feature type
  hog:
    orientations: 8
    pixels_per_cell: [8, 8]
    cells_per_block: [2, 2]
  pixel:
    flatten_size: [32, 32]

similarity:
  metric: cosine                # final system metric

threshold:
  value: 0.8045                 # calibrated on val split (max balanced accuracy / Youden-J)
  selection_rule: max_balanced_accuracy
  calibration_split: val
  n_points: 20                  # fine-grained sweep (run05)

final_system:
  run_id: run05
  features: hog
  metric: cosine
  pair_mode: filtered
  threshold: 0.8045
  val_auc: 0.6202
  test_f1: 0.4632

tracking:
  runs_log: outputs/runs_log.csv
  plots_dir: outputs/plots

profiling:
  batch_sizes: [1, 2, 4, 8, 16, 32, 64]
  warmup_runs: 2
  timed_runs: 5
  output_dir: outputs/profiling
